[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentis-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.3",
    "pydantic[email]>=2.7",
    "pyjwt[crypto]>=2.8",
    "passlib[bcrypt]>=1.7",
    "redis>=5.0",
    "structlog>=24.0",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "docker>=7.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio[trio]>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["slow: marks tests as slow integration tests requiring a real Docker sandbox"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I"]

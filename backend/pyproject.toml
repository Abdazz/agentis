[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentis-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.3",
    "pydantic[email]>=2.7",
    "pyjwt[crypto]>=2.8",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=3.2.0,<4.0.0",
    "redis>=5.0",
    "structlog>=24.0",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "docker>=7.0",
    "python-multipart>=0.0.9",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.2",
    "celery[redis]>=5.4",
    "langfuse>=2.50",
    "tiktoken>=0.8",
    "psycopg[binary,pool]>=3.2",
    "qdrant-client>=1.9,<1.10",
    "voyageai>=0.2",
    "minio>=7.2",
    "prometheus-client>=0.20",
    "mcp>=1.0",
    "pyyaml>=6.0",
    "jsonref>=1.1",
    "clamd>=1.0",
]

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.0.3",
    "edge-tts>=6.1.12",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio[trio]>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["slow: marks tests as slow integration tests requiring a real Docker sandbox"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I"]

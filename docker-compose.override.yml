services:
  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    environment:
      - AGENTIS_ENVIRONMENT=development
      - AGENTIS_LOG_LEVEL=DEBUG
  postgres:
    ports: ["5436:5432"]
  redis:
    ports: ["6379:6379"]

  worker:
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
    command: watchmedo auto-restart --directory=/app/app --pattern="*.py" --recursive -- celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    environment:
      AGENTIS_POSTGRES_DIRECT_URL: postgresql+asyncpg://agentis:agentis@postgres:5432/agentis

  sandbox:
    image: agentis-sandbox:latest
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    profiles: ["sandbox"]

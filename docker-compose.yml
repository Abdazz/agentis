services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      - AGENTIS_DATABASE_URL=postgresql+asyncpg://agentis:agentis@pgbouncer:5432/agentis
      - AGENTIS_POSTGRES_DIRECT_URL=postgresql+asyncpg://agentis:agentis@postgres:5432/agentis
      - AGENTIS_REDIS_BROKER_URL=redis://redis:6379/0
      - AGENTIS_REDIS_CACHE_URL=redis://redis:6379/1
      - AGENTIS_JWT_PRIVATE_KEY_PATH=/secrets/jwt/private.pem
      - AGENTIS_JWT_PUBLIC_KEY_PATH=/secrets/jwt/public.pem
    volumes:
      - ./secrets/jwt:/secrets/jwt:ro
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=4
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # sandbox container management
    networks:
      - agentis_default

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentis
      POSTGRES_PASSWORD: agentis
      POSTGRES_DB: agentis
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentis"]
      interval: 5s
      retries: 10
      start_period: 10s

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: agentis
      DB_PASSWORD: agentis
      DB_NAME: agentis
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    ports: ["5435:5432"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432 || exit 1"]
      interval: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.9.2
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' 2>/dev/null"]
      interval: 10s
      retries: 5
      start_period: 15s

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: agentis
      MINIO_ROOT_PASSWORD: agentis123
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9000' 2>/dev/null"]
      interval: 10s
      retries: 5
      start_period: 15s

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 agentis agentis123;
        mc mb --ignore-existing local/agentis-uploads;
        mc mb --ignore-existing local/agentis-artifacts;
        mc mb --ignore-existing local/agentis-backups;
        echo 'Buckets ready';
      "

  langfuse:
    image: langfuse/langfuse:2
    ports: ["3001:3000"]
    environment:
      DATABASE_URL: postgresql://agentis:agentis@postgres:5432/langfuse
      NEXTAUTH_SECRET: dev-secret-change-in-prod
      NEXTAUTH_URL: http://localhost:3001
      SALT: dev-salt
    depends_on:
      postgres: {condition: service_healthy}
    profiles: ["langfuse"]
    # NOTE: Langfuse requires its own DB. Create it before starting:
    # docker compose up postgres -d
    # docker compose exec postgres createdb -U agentis langfuse

  squid:
    image: ubuntu/squid:latest
    volumes:
      - ./squid/squid.conf:/etc/squid/squid.conf:ro
    restart: unless-stopped

  ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
      NEXT_PUBLIC_DEFAULT_LOCALE: fr
    depends_on:
      - api
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.2
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    profiles: ["observability"]

  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3002:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    profiles: ["observability"]

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  grafana_data:
  loki_data:

networks:
  agentis_default:
    driver: bridge
